# Hybrid Controller Parameters for BlueROV2
# Combines velocity-based and position-based control
#
# Control Modes:
#   - Velocity mode: Fast path following (responsive, accepts drift)
#   - Position mode: Precise position hold (stable, zero drift)
#
# Mode switching: Controlled by path_following_4dof_node
#   - Path following → velocity mode
#   - Last waypoint → position mode
#
# ============================================
# 포화 한계 물리 근거 (fix/thrust-map, 2026-08-22)
# ============================================
# 추진기당 T_max = ρ·kT·n_max²·D⁴ = 1031.0·0.167·60²·0.076⁴ ≈ 20.68 N
# (bluerov2.scn: thrust_coeff=0.167, max_rpm=3600, D=0.076 m;
#  ρ=1031.0은 data/worlds/common/environment.scn의 water density)
# TAM(BlueROV2 Heavy) 축별 **단일축** 상한 (그 축만 단독 명령 시):
#   surge/sway = 4·cos45°·20.68 ≈ 58.5 N, heave = 4·20.68 ≈ 82.7 N
#   yaw = 4·0.16652·20.68 ≈ 13.77 N·m
# 다축 동시명령은 이 한계 이내라도 추진기당 T_max를 넘을 수 있다
# (예: surge 55 N + yaw 8 N·m → 추진기당 153%) — allocator가 방향보존
# 균등 스케일링으로 처리하므로 wrench 방향은 보존되고 크기만 준다.
# max_force는 3축 공통 스칼라이므로 surge/sway 기준 55 N(마진 6%)로 설정 —
# heave는 물리 한계(82.7)보다 보수적이 된다. max_torque는 13.7 N·m.
# 종전 800 N/160 N·m는 물리 한계의 ~14배로, anti-windup이 실효 영역에서
# 발동하지 않아 코너 적분 폭주의 원인이었다.
#
# 게인은 물리 기반 재산정 초기값(P1 닫힌루프 튜닝 대상):
#   inner/velocity Kp ≈ m·ω_c (m=20.13 kg, ω_c≈2 rad/s) ≈ 40 N/(m/s)
#   Ki = Kp/T_i (T_i≈2 s), Kd는 구 게인 스케일비(/5) 승계
#   yaw는 P2 실측 I_zz_eff≈0.24(added inertia 0.11 포함, 진동 잡음으로
#   order만 신뢰)라 대역폭식 대신 포화 정합으로 4 N·m/(rad/s) —
#   실측 기준 ω_c = Kp_r/I_zz_eff ≈ 17 rad/s로 선형축(≈2)보다 공격적:
#   로터 지연(τ≈0.12~0.2s 실측) 대비 진동 성향 가능성
#   → 실기 sign-off에서 yaw 스텝 응답 오버슈트/진동 확인 필수
# 종전 게인(Kp 200~400)은 제곱 왜곡된 플랜트 위에서 튜닝된 값이라 승계 불가.

# Wildcard node-name match: binds regardless of the launch `name=` override
# (repo convention, cf. path_following.yaml / path_generator.yaml). Without this
# the non-wildcard key did not match the launch runtime name 'hybrid_controller'
# and all PID gains silently fell back to declare_parameter defaults (T1.2/H4).
/**:
  ros__parameters:
    # General
    vehicle_name: 'bluerov2'
    control_rate: 50.0  # Hz
    initial_mode: 'velocity'  # 'velocity' or 'position'

    # ============================================
    # Velocity Mode (Path Following)
    # ============================================
    # Fast, responsive control for path tracking
    # Lower precision, accepts some drift
    velocity_mode:
      # PID Gains — 물리 기반 초기값 (헤더 도출 참조)
      Kp: [40.0, 40.0, 50.0, 4.0]   # [surge, sway, heave, yaw]
      Kd: [0.0, 20.0, 20.0, 1.0]    # Surge Kd=0 (no damping)
      Ki: [20.0, 20.0, 25.0, 2.0]
      Kb: [0.8, 0.8, 0.8, 0.8]      # Anti-windup back-calculation

      # Saturation limits (물리 한계 정합 — 헤더 도출 참조)
      max_force: 55.0    # N
      max_torque: 13.7   # Nm

      # Integral safety factor (lower = less integral authority)
      # Formula: integral_limit = (sat_limit / Ki) × safety_factor
      integral_safety_factor: 0.5

    # ============================================
    # Position Mode (Position Hold)
    # ============================================
    # Precise, stable control for waypoint arrival
    # High precision, zero drift
    position_mode:
      # PD 축: Kp ≈ m·ω_n² (ω_n≈1.5), Kd ≈ 2ζω_n·m (ζ≈0.7)
      Kp: [45.0, 45.0, 55.0, 3.0]   # [surge, sway, heave, yaw]
      Kd: [40.0, 40.0, 50.0, 1.5]
      Ki: [5.0, 5.0, 10.0, 0.5]
      Kb: [0.8, 0.8, 0.8, 0.8]

      # Saturation limits (물리 한계 정합)
      max_force: 55.0    # N
      max_torque: 13.7   # Nm

      # Integral safety factor (higher = more integral authority)
      integral_safety_factor: 2.0

    # ============================================
    # Cascade Mode (Position-Cascade Path Following)
    # ============================================
    # outer 위치-P → 속도 setpoint → inner 속도-PI → 힘/토크
    # heading vs 위치보정 이중보정을 구조적으로 제거(설계 SSOT §4)
    cascade:
      outer_loop:
        # 위치오차[m,rad] → 속도 setpoint[m/s,rad/s] (느린 루프)
        # 운동학적 게인이라 추력맵 왜곡과 무관 — 기존값 유지 (P6 이력 포함)
        # 대역 분리: outer ~0.4 rad/s ≪ inner ~2 rad/s (5×)
        Kp: [0.4, 0.5, 0.3, 0.8]   # [x, y, z, yaw]
        Ki: [0.0, 0.0, 0.0, 0.0]   # outer I 비활성 — 적분은 inner만(windup 차단)
      inner_loop:
        # 속도오차[m/s,rad/s] → 힘/토크[N,Nm] — 실측 플랜트 기반 (P2 2026-08-22
        # open-loop 스텝 프로브, dynamics_params.yaml 참조).
        # 유효질량 M_eff = [70.2, 62.0, 63.9] kg (부가질량 포함 — 건질량 20.13의
        # 3.1~3.5배). 종전 Kp=40은 가정 질량 20.13 기준 ω_c=2 설계였으나 실측
        # 질량으론 실효 ω_c=0.57 rad/s(설계의 29%)에 불과했다.
        # Kp = M_eff·ω_c (ω_c=2 rad/s), Ki = Kp/2 (적분시정수 4/ω_c).
        # yaw는 I_zz 실측이 진동 잡음으로 부정확(~0.24, order만 신뢰) →
        # P1에서 검증된 기존값 유지.
        # 포화: Kp·e = 55 N은 e≈0.4 m/s — 코너 과도의 순간 포화는
        # back-calculation이 흡수 (acc_ff는 기본 off — accel_ff_cutoff_hz 참조).
        Kp: [140.0, 124.0, 128.0, 4.0]
        Ki: [70.0, 62.0, 64.0, 2.0]
        Kd: [0.0, 20.0, 20.0, 1.0]   # 실측 유도 아님 — P0 경험값 유지
        Kb: [0.8, 0.8, 0.8, 0.8]
        integral_safety_factor: 0.5
      # 속도 setpoint 포화 [u,v,w,r].
      # surge 0.6: 실측 v_max(55 N)=0.911 m/s라 종전 1.2는 도달 불가(상시
      #   포화·windup 압력원). 0.7도 폐루프에서 반증(2026-08-22 runF/runG):
      #   정상 항력 40.5 N=55 N의 73%라 여유가 부족해, 초기 과도가 감쇠
      #   못 하면 surge 포화(duty 32%)→allocator 스케일링이 yaw/sway 권한
      #   잠식→사행→사이드슬립 항력 증가→포화 지속의 쌍안정 잠김이 발생
      #   (동일 설정 2런이 청정 0.227/사행 0.403으로 갈림, corr(duty,
      #   v_y_std)=0.56). 0.6은 정상 29.9 N(54%)·yaw 여유 15.2 N·m로 복원.
      #   0.9는 균등 스케일링에서 수평 추진기 여유가 0. 실측 항력 기준:
      #     v[m/s]  F_surge[N]  추진기당[N]  yaw 여유[N·m]
      #      0.6      29.9        10.57        15.18
      #      0.7      40.5        14.32         9.55
      #      0.8      52.7        18.63         3.07
      #      0.9      66.5        23.52         0.00
      #   0.7에서 yaw 여유 9.6 N·m(max_torque의 70%) 확보.
      #   (Open Q1: 실기 요구 속도는 사용자 결정 — 이 표가 판단 근거)
      # sway 0.5: 곡률 feedforward 헤드룸 (P6), heave/yaw 기존 유지
      v_sp_limit: [0.6, 0.5, 0.25, 0.6]
      # accel ff(v_sp 미분) LPF 차단주파수 [Hz]. 0 = accel ff 비활성(기본).
      # 폐루프 계측(2026-08-22 runE/F/G): 사행의 원인은 acc_ff가 아니라
      #   surge 포화 쌍안정으로 재판정됨(위 v_sp_limit 주석) — OFF에서도
      #   사행 런(runG) 존재. acc_ff는 이득 미입증에 자기되먹임 경로(v_sp가
      #   outer P 경유 차량 위치의 함수)를 더하므로 기본 off 유지.
      #   켜려면 폐루프 재검증 필수.
      accel_ff_cutoff_hz: 0.0
      max_force: 55.0    # N (물리 한계 정합)
      max_torque: 13.7   # Nm

# Design Notes:
#
# Velocity Mode:
#   - Kd[0]=0 to avoid surge damping
#   - Low integral_safety_factor to prevent windup
#
# Position Mode:
#   - PD-dominant gains for stability, low Ki
#   - High integral_safety_factor for steady-state accuracy
#
# Saturation:
#   - 모든 모드 공통: 물리 한계 정합 55 N / 13.7 N·m (헤더 도출 참조)
#   - allocator(thruster_allocator_node)가 추진기당 ±20.62 N로 최종 클립
#
# Switching Logic:
#   - Handled by path_following_4dof_node
#   - Publishes control_mode ('velocity' or 'position')
#   - Hybrid controller resets integral on mode switch
