# BlueROV2 Vehicle Dynamics Parameters
#
# ============================================================================
# SINGLE SOURCE OF TRUTH FOR BLUEROV2 DYNAMICS
# ============================================================================
# ALL controllers MUST read mass, inertia, COG, COB from this file.
# DO NOT duplicate these values in other config files (pid_params.yaml, etc.)
#
# Primary Reference: bluerov2.scn (Stonefish scenario file)
# All values calculated from active components in bluerov2.scn
#
# Coordinate Convention:
#   Body Frame: FRD (Forward-Right-Down)
#   - X: Forward (surge)
#   - Y: Right (sway)
#   - Z: Down (heave)
#
# Note: For model-based control (is_model_based=True)
#       Basic PID (is_model_based=False) only uses: mass, inertial, cog, cob, volume

/**:
  ros__parameters:
    # =============================================================================
    # Mass Properties (from bluerov2.scn active components)
    # =============================================================================
    # Total mass calculation (PASSIVE STABILITY CONFIG):
    #   FoamTop (0.5 kg) + BallastBottom (19.631 kg)
    #   = 20.131 kg (NEUTRAL BUOYANCY)
    #
    # Weight: W = 20.131 × 9.82 = 197.7 N
    # Buoyancy: B = 1028 × 9.82 × 0.019582 = 197.7 N
    # Net force: B - W ≈ 0 N (neutral buoyancy)
    mass: 20.131  # kg

    # =============================================================================
    # Inertia Tensor (kg⋅m²) - Point mass approximation from .scn
    # =============================================================================
    # Calculated from component positions relative to CoG
    # I = Σ m_i * r_i² where r_i is distance from CoG
    #
    # Dominant component: BallastBottom (19.631 kg at z=0.18m)
    #   I_xx ≈ I_yy ≈ 19.631 × 0.18² ≈ 0.636 kg·m²
    #   I_zz ≈ 19.631 × 0.08² ≈ 0.126 kg·m² (ballast radius)
    # Minor component: FoamTop (0.5 kg, box 0.25×0.20×0.26m at z=-0.10m)
    #   I_xx_foam ≈ 0.01, I_yy_foam ≈ 0.01, I_zz_foam ≈ 0.005 kg·m²
    # Total: I_xx ≈ 0.646, I_yy ≈ 0.646, I_zz ≈ 0.131 kg·m²
    inertial:
      ixx: 0.65    # Roll axis (about X)
      iyy: 0.65    # Pitch axis (about Y)
      izz: 0.13    # Yaw axis (about Z)
      ixy: 0.0     # Products of inertia
      ixz: 0.0
      iyz: 0.0

    # =============================================================================
    # Center of Gravity (m) - Body frame
    # =============================================================================
    # Calculated as weighted average of component positions
    # CoG = Σ(m_i * pos_i) / Σm_i
    #
    # FoamTop:    0.5 kg at z = -0.10 m
    # BallastBottom: 19.631 kg at z = +0.18 m
    # Total: 20.131 kg (internal parts only)
    #
    # COG_z = (0.5×(-0.10) + 19.631×0.18) / 20.131
    #       = (-0.05 + 3.534) / 20.131
    #       = 3.484 / 20.131 ≈ 0.173 m
    cog: [0.0, 0.0, 0.173]

    # =============================================================================
    # Center of Buoyancy (m) - Body frame
    # =============================================================================
    # Geometric center of buoyant parts
    # FoamTop (box 0.25×0.20×0.26m) centered at z = -0.10m
    # (Negative Z = upward in FRD frame, Down is positive)
    cob: [0.0, 0.0, -0.10]

    # =============================================================================
    # Metacentric Height (Passive Stability)
    # =============================================================================
    # GM = COB_z - COG_z = -0.10 - 0.173 = -0.273 m
    # |GM| = 0.273 m > 0.15 m (MEETS DESIGN REQUIREMENT ✓)
    #
    # Restoring moment for roll/pitch:
    #   τ_restoring ≈ (B - W) × GM × sin(θ)
    #   τ_restoring ≈ 2.6 N × 0.262 m × sin(θ) ≈ 0.68 Nm at θ=90°
    #
    # Expected settling time for roll/pitch: 5-10 seconds (passive damping)

    # =============================================================================
    # Volume and Fluid Properties
    # =============================================================================
    # Volume of buoyant parts: FoamTop box (0.29 × 0.25 × 0.2701 m)
    # V = 0.29 × 0.25 × 0.2701 = 0.019582 m³
    # Buoyancy = 1028 × 9.82 × 0.019582 = 197.7N
    # Net buoyancy = 197.7 - 197.7 = 0N (neutral buoyancy)
    volume: 0.019582  # m³

    # Fluid density (saltwater)
    density: 1028.0  # kg/m³

    # Gravity acceleration
    gravity: 9.82  # m/s²

    # =============================================================================
    # Bounding Box Dimensions (m)
    # =============================================================================
    # From .scn geometry (approximate)
    length: 0.457  # X-axis (forward)
    width: 0.338   # Y-axis (lateral)
    height: 0.254  # Z-axis (vertical)

    # =============================================================================
    # Hydrodynamic Coefficients — MEASURED (2026-08-22 open-loop step probe)
    # =============================================================================
    # System ID: sim+allocator only (컨트롤러 없음), body-frame wrench 스텝 주입
    #   surge/sway {±10..±40} N · heave {10..30} N down · yaw {±2..8} N·m,
    #   15 s hold / 10 s rest, odometry(~65 Hz) bag 기록.
    # 피팅(축별):
    #   정상상태 → F = d1·v + d2·v|v| (+c, heave만)          [최소자승]
    #   과도구간 → (M_eff, tau_rotor) 결합 시뮬레이션 피팅
    #              dF/dt=(F_cmd−F)/tau_r ; M_eff·dv/dt=F−d1·v−d2·v|v|−c
    # 유효범위: v ≤ 0.7 m/s에서 정상상태 fit 오차 <2%. 55 N 실측 v_max=0.911 m/s
    #   는 2차 외삽(0.82)보다 높음 — 고속역에서 이 모델이 항력을 ~24% 과대
    #   (비이차 항력 vs 추진기 유입속도 추력 감소는 분리 불가).
    # tau_rotor(추진기 스핀업 1차 지연): surge 0.122 s · sway 0.196 s
    #   (heave/yaw는 0.16 s 고정 후 M만 피팅).
    # yaw I_zz_eff 0.24는 진동 잔차(RMS 0.13 rad/s) 포함 — 크기 정도만 신뢰.
    # roll/pitch는 수동 안정(제어 비대상)이라 미측정 = 0.0 유지.
    #
    # NOTE: rcl 파라미터 파서는 중첩 리스트(6×6)를 거부하므로 대각 성분만
    #       flat 리스트로 기재. 순서 = [surge, sway, heave, roll, pitch, yaw].

    # M_eff 실측: surge 70.2, sway 62.0, heave 63.9 kg, yaw 0.24 kg·m²
    # added_mass_diag = M_eff − 강체(mass 20.131 / inertial.izz)
    added_mass_diag: [50.1, 41.9, 43.8, 0.0, 0.0, 0.11]

    # d1 [N·s/m | N·m·s/rad]
    linear_damping_diag: [1.65, 11.30, 17.95, 0.0, 0.0, 0.31]

    # d2 [N·s²/m² | N·m·s²/rad²]
    quad_damping_diag: [80.28, 44.25, 157.51, 0.0, 0.0, 0.45]

    # 잔류 부력: v=0 심도 유지에 +7.27 N(NED 하향) 필요 — 부력 > 중량 (기록용)
    residual_buoyancy_force: 7.27  # N

    # 추진기 스핀업 1차 지연 대표값 (기록용)
    thruster_time_constant: 0.16  # s
